# Pushing a tag like v0.1.0 builds Unfoxed.exe and attaches it to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build Unfoxed.exe
        shell: cmd
        run: build.bat

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Unfoxed.exe --title "Unfoxed $GITHUB_REF_NAME" --generate-notes
